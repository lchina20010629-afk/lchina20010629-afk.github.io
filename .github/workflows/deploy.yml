name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 最小化权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制，避免覆盖部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        
      # dist/data is populated from public/data by Vite
      # NEVER delete dist/data - it contains legitimate encrypted content
      
      # GitHub Pages is in legacy mode serving from branch root
      # Copy dist contents to root for deployment
      - name: Prepare root for GitHub Pages
        run: |
          # Remove source files that shouldn't be served
          rm -f index.html
          # Copy built files to root
          cp -r dist/* .
          # Verify data directory
          ls -la data/
          echo "✓ Built files copied to root for GitHub Pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
